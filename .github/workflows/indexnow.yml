name: IndexNow

# Après chaque déploiement de production réussi (statut publié par Vercel),
# signale à Bing & co les pages modifiées. Lançable à la main pour tout
# resoumettre.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      all:
        description: "Soumettre toutes les URL du sitemap"
        type: boolean
        default: false

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow-submit.mjs ${{ inputs.all && '--all' || '' }}
