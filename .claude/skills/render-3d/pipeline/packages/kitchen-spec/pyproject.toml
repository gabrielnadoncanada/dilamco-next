[project]
name = "kitchen-spec"
version = "0.1.0"
description = "Pydantic schemas for KitchenSpec — Dilamco Kitchen Designer intermediate format"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitchen_spec"]
